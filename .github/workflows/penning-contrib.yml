name: Penning-trap contribution graph

# Redraws assets/contrib/penning-{dark,light}.svg from the contribution calendar
on:
  schedule:
    - cron: "15 */6 * * *"   # every six hours
  workflow_dispatch:
  push:
    paths: ["scripts/penning-contrib.mjs", ".github/workflows/penning-contrib.yml"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Draw the graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/penning-contrib.mjs
      - name: Commit if anything changed
        run: |
          git add assets/contrib
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Penning-trap contribution graph: refresh"
          git pull --rebase origin main
          git push
